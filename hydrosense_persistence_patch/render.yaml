services:
  - type: web
    name: hydrosense
    runtime: node
    plan: free # Keep free unless you approve a paid upgrade. Free storage is ephemeral.
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: AUTHORITY_EMAIL_DOMAIN
        value: krct.ac.in
      - key: AUTHORITY_INVITE_CODE
        sync: false
      - key: REPORT_CODE_PREFIX
        value: TRI
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: SEED_DEMO_DATA
        value: "true"
      # PERSISTENT STORAGE (requires a paid web-service instance and a disk):
      # Attach a disk mounted at /var/data in Render Dashboard, then add:
      # DB_PATH=/var/data/hydrosense.db
      # UPLOAD_DIR=/var/data/uploads
      # A persistent disk preserves SQLite and evidence uploads across restarts/redeploys.
